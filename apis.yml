name: Admission Table
description: 'Admission Table (admissiontable.com) was a study-abroad and overseas-education
  counseling platform founded in 2013 by Manish Katyan and Duleep Deosthale, offering
  real-time student counseling, university admissions guidance, scholarships, financing,
  and online test preparation for the SAT, GRE, GMAT, TOEFL, and IELTS. It was backed
  by 500 Global, NYU, and Aarin Capital, and was subsequently acquired by Azent Overseas
  Education. The admissiontable.com domain now permanently redirects (HTTP 301) to
  azent.com. This entry was surfaced as a 500 Global portfolio company and added to
  the API Evangelist network as a stub; enrichment found no public API, developer
  program, or API documentation on either host, so no API artifacts were produced.'
